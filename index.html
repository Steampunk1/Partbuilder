<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part Builder — Steampunk Fabrication</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A6CE39">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Part Builder">
<link rel="apple-touch-icon" href="icon-apple.png">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<!-- Fonts + Steampunk design tokens (all local — works offline) -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="assets/colors_and_type.css">
<!-- three.js, vendored — same pinned 0.184.0 files the prototype used from unpkg -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/three/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "./vendor/three/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "./vendor/three/GLTFExporter.js"
  }
}
</script>
<script src="./three-d-stage.js"></script>
<script src="./vendor/qrcode.js"></script>
<style>
  body{margin:0;background:#0A0B0D;overflow:hidden}
  a{color:#A6CE39}
  a:hover{color:#C6E06F}
  button:disabled{opacity:.45;pointer-events:none}
  three-d-stage:not(:defined){visibility:hidden}
  ::selection{background:rgba(166,206,57,.35)}
  input::placeholder{color:#5C6670}
  .sc-host.sc-has-error{position:relative}
  .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
    padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
    border-radius:4px;white-space:pre-wrap;pointer-events:none}
</style>
<!-- App runtime: React (vendored) + pb-runtime (template engine) + the logic class -->
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./pb-runtime.js"></script>
<script src="./app.js"></script>
</head>
<body>
<div id="pb-root"></div>
<!-- The UI template, kept parser-inert; pb-runtime compiles it at boot.
     Ported unchanged from Part Builder.dc.html <x-dc> (helmet moved into the
     real <head> above; sibling-tool links now point at the design project). -->
<script type="text/pb-template">
<div style="height:100vh;display:flex;flex-direction:column;background:var(--ink);color:var(--fg);font:var(--t-body)" data-screen-label="Part Builder">
  <div style="display:flex;align-items:center;gap:16px;padding:0 16px;height:60px;background:var(--gunmetal-900);border-bottom:1px solid var(--border);flex:none">
    <img src="assets/logo-chrome.jpg" alt="Steampunk Fabrication" style="height:44px;display:block;flex:none">
    <div style="width:1px;height:32px;background:var(--border);flex:none"></div>
    <div style="flex:none">
      <div style="font:700 9.5px/1 var(--font-head);text-transform:uppercase;letter-spacing:.24em;color:var(--hivis)">Shop Tools · 12KW Fiber Laser</div>
      <div style="margin-top:3px;font:800 22px/1 var(--font-display);font-style:italic;text-transform:uppercase;letter-spacing:.01em;background:var(--chrome-gradient);-webkit-background-clip:text;background-clip:text;color:transparent">Part Builder</div>
    </div>
    <div style="flex:1;min-width:0;text-align:center;font:700 12px/1 var(--font-mono);letter-spacing:.05em;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ topChip }}</div>
    <div style="flex:none;font:500 10px/1.5 var(--font-mono);letter-spacing:.06em;color:var(--steel-400);text-align:right">ROTARY TUBE LASER · ANY PROFILE<br>TRUE SIZE — KERF STAYS IN CAM</div>
    <button onClick="{{ tgHelp }}" style="{{ helpBtnS }}">HOW IT WORKS</button>
    <button onClick="{{ tgJob }}" style="{{ jobBtnS }}">JOB · {{ jobCount }}</button>
  </div>
  <div style="flex:1;min-height:0;display:flex">
    <div style="width:348px;flex:none;background:var(--gunmetal-900);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;padding:12px 16px 0;display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px 6px">
        <span style="font:700 10px/1 var(--font-head);text-transform:uppercase;letter-spacing:.22em;color:var(--hivis);white-space:nowrap">Step {{ stepN }} of 5 — {{ stepName }}</span>
        <span style="font:500 10px/1 var(--font-mono);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ chip }}</span>
      </div>
      <div style="height:3px;background:var(--gunmetal-800);border-radius:2px;margin:0 4px 10px;overflow:hidden;flex:none"><div style="{{ progS }}"></div></div>
      <button onClick="{{ goto1 }}" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--border);padding:11px 4px;cursor:pointer" style-hover="background:rgba(166,206,57,.05)">
        <span style="{{ n1S }}">{{ n1T }}</span>
        <span style="flex:1;min-width:0"><span style="display:block;font:700 12px/1 var(--font-head);text-transform:uppercase;letter-spacing:.12em;color:var(--fg)">The stock</span><span style="display:block;margin-top:3px;font:500 9.5px/1.3 var(--font-mono);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ sum1 }}</span></span>
        <span style="flex:none;color:var(--fg-3);font:500 11px/1 var(--font-mono)">{{ car1 }}</span>
      </button>
      <sc-if value="{{ open1 }}" hint-placeholder-val="{{ true }}">
        <div style="padding:2px 4px 14px;display:flex;flex-direction:column;gap:12px">
          <div style="font:400 11px/1.55 var(--font-body);color:var(--fg-2);border-bottom:1px dashed var(--steel-600);padding-bottom:9px">Pick what you're cutting, its size, cut length and grade. The 3D part and the flat laser program below build live as you type — quick starts set both ends in one tap.</div>
          <div>
            <div style="font:500 9px/1 var(--font-mono);color:var(--fg-3);margin-bottom:5px">WHAT ARE WE CUTTING?</div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px">
              <button onClick="{{ pickPipe }}" style="{{ fbPipe }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="5" opacity="0.45"></circle></svg><span style="font:700 9px/1 var(--font-head);letter-spacing:.1em">PIPE</span></button>
              <button onClick="{{ pickHss }}" style="{{ fbHss }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="4" y="4" width="16" height="16" rx="3.5"></rect><rect x="6.5" y="6.5" width="11" height="11" rx="2" opacity="0.45"></rect></svg><span style="font:700 9px/1 var(--font-head);letter-spacing:.1em">SQ/RECT</span></button>
              <button onClick="{{ pickBeam }}" style="{{ fbBeam }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 4.5H19M5 19.5H19M12 4.5V19.5"></path></svg><span style="font:700 9px/1 var(--font-head);letter-spacing:.1em">BEAM</span></button>
              <button onClick="{{ pickChan }}" style="{{ fbChan }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M17 4.5H7V19.5H17"></path></svg><span style="font:700 9px/1 var(--font-head);letter-spacing:.1em">CHANNEL</span></button>
              <button onClick="{{ pickAngl }}" style="{{ fbAngl }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M7 4.5V19.5H19.5"></path></svg><span style="font:700 9px/1 var(--font-head);letter-spacing:.1em">ANGLE</span></button>
            </div>
          </div>
          <sc-if value="{{ isPipe }}" hint-placeholder-val="{{ true }}">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
              <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">NPS</div><select data-sv="{{ pnps }}" value="{{ pnps }}" onChange="{{ onPnps }}" style="width:100%;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 13px/1.2 var(--font-body);padding:9px 6px" style-focus="border-color:#A6CE39;outline:none"><sc-for list="{{ pipeNpsOpts }}" as="o" hint-placeholder-count="8"><option value="{{ o }}">{{ o }}″</option></sc-for></select></div>
              <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">SCHEDULE</div><select data-sv="{{ psch }}" value="{{ psch }}" onChange="{{ onPsch }}" style="width:100%;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 13px/1.2 var(--font-body);padding:9px 6px" style-focus="border-color:#A6CE39;outline:none"><sc-for list="{{ pipeSchedOpts }}" as="o" hint-placeholder-count="6"><option value="{{ o }}">{{ o }}</option></sc-for></select></div>
            </div>
          </sc-if>
          <sc-if value="{{ isHss }}" hint-placeholder-val="{{ false }}">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
              <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">SIZE — TALL × WIDE</div><select data-sv="{{ hsize }}" value="{{ hsize }}" onChange="{{ onHsize }}" style="width:100%;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 13px/1.2 var(--font-body);padding:9px 6px" style-focus="border-color:#A6CE39;outline:none"><sc-for list="{{ hssSizeOpts }}" as="o" hint-placeholder-count="8"><option value="{{ o }}">HSS {{ o }}</option></sc-for></select></div>
              <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">WALL</div><select data-sv="{{ hwallT }}" value="{{ hwallT }}" onChange="{{ onHwall }}" style="width:100%;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 13px/1.2 var(--font-body);padding:9px 6px" style-focus="border-color:#A6CE39;outline:none"><sc-for list="{{ hssWallOpts }}" as="o" hint-placeholder-count="6"><option value="{{ o }}">{{ o }}″</option></sc-for></select></div>
            </div>
          </sc-if>
          <sc-if value="{{ isBeam }}" hint-placeholder-val="{{ false }}">
            <div style="display:grid;grid-template-columns:88px 1fr;gap:6px">
              <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">SERIES</div><select data-sv="{{ bser }}" value="{{ bser }}" onChange="{{ onBser }}" style="width:100%;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 13px/1.2 var(--font-body);padding:9px 6px" style-focus="border-color:#A6CE39;outline:none"><option value="W">W</option><option value="S">S</option><option value="CUST">CUSTOM</option></select></div>
              <sc-if value="{{ notCustomBeam }}" hint-placeholder-val="{{ false }}">
                <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">SIZE</div><select data-sv="{{ bsize }}" value="{{ bsize }}" onChange="{{ onBsize }}" style="width:100%;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 13px/1.2 var(--font-body);padding:9px 6px" style-focus="border-color:#A6CE39;outline:none"><sc-for list="{{ beamSizeOpts }}" as="o" hint-placeholder-count="8"><option value="{{ o }}">{{ o }}</option></sc-for></select></div>
              </sc-if>
            </div>
            <sc-if value="{{ isCustom }}" hint-placeholder-val="{{ false }}">
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:5px">
                <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">DEPTH</div><input value="{{ cdT }}" onChange="{{ onCd }}" style="width:100%;box-sizing:border-box;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 12px/1.2 var(--font-mono);padding:6px 6px" style-focus="border-color:#A6CE39;outline:none"></div>
                <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">FLG W</div><input value="{{ cbT }}" onChange="{{ onCb }}" style="width:100%;box-sizing:border-box;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 12px/1.2 var(--font-mono);padding:6px 6px" style-focus="border-color:#A6CE39;outline:none"></div>
                <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">FLG T</div><input value="{{ ctfT }}" onChange="{{ onCtf }}" style="width:100%;box-sizing:border-box;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 12px/1.2 var(--font-mono);padding:6px 6px" style-focus="border-color:#A6CE39;outline:none"></div>
                <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">WEB T</div><input value="{{ ctwT }}" onChange="{{ onCtw }}" style="width:100%;box-sizing:border-box;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 12px/1.2 var(--font-mono);padding:6px 6px" style-focus="border-color:#A6CE39;outline:none"></div>
                <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">LB/FT</div><input value="{{ cwT }}" onChange="{{ onCw }}" style="width:100%;box-sizing:border-box;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 12px/1.2 var(--font-mono);padding:6px 6px" style-focus="border-color:#A6CE39;outline:none"></div>
              </div>
            </sc-if>
          </sc-if>
          <sc-if value="{{ isChan }}" hint-placeholder-val="{{ false }}">
            <div style="display:grid;grid-template-columns:88px 1fr;gap:6px">
              <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">SERIES</div><select data-sv="{{ cser }}" value="{{ cser }}" onChange="{{ onCser }}" style="width:100%;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 13px/1.2 var(--font-body);padding:9px 6px" style-focus="border-color:#A6CE39;outline:none"><option value="C">C</option><option value="MC">MC</option></select></div>
              <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">SIZE</div><select data-sv="{{ csize }}" value="{{ csize }}" onChange="{{ onCsize }}" style="width:100%;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 13px/1.2 var(--font-body);padding:9px 6px" style-focus="border-color:#A6CE39;outline:none"><sc-for list="{{ chanSizeOpts }}" as="o" hint-placeholder-count="8"><option value="{{ o }}">{{ o }}</option></sc-for></select></div>
            </div>
          </sc-if>
          <sc-if value="{{ isAngl }}" hint-placeholder-val="{{ false }}">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
              <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">LEGS — VERT × HORIZ</div><select data-sv="{{ asize }}" value="{{ asize }}" onChange="{{ onAsize }}" style="width:100%;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 13px/1.2 var(--font-body);padding:9px 6px" style-focus="border-color:#A6CE39;outline:none"><sc-for list="{{ anglSizeOpts }}" as="o" hint-placeholder-count="8"><option value="{{ o }}">L{{ o }}</option></sc-for></select></div>
              <div><div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">THICKNESS</div><select data-sv="{{ athkT }}" value="{{ athkT }}" onChange="{{ onAthk }}" style="width:100%;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 13px/1.2 var(--font-body);padding:9px 6px" style-focus="border-color:#A6CE39;outline:none"><sc-for list="{{ anglThkOpts }}" as="o" hint-placeholder-count="6"><option value="{{ o }}">{{ o }}″</option></sc-for></select></div>
            </div>
          </sc-if>
          <div style="font:500 10px/1.5 var(--font-mono);color:var(--fg-3)">{{ stockEcho }}</div>
          <div>
            <div style="font:500 9px/1 var(--font-mono);color:var(--fg-3);margin-bottom:4px">QUICK STARTS — SETS BOTH ENDS, TWEAK AFTER</div>
            <div style="display:flex;flex-wrap:wrap;gap:5px">
              <sc-for list="{{ quicks }}" as="q" hint-placeholder-count="3">
                <button onClick="{{ q.go }}" style="padding:7px 10px;cursor:pointer;border-radius:4px;border:1px solid var(--steel-600);background:transparent;color:var(--fg-2);font:700 10px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase" style-hover="border-color:#A6CE39;color:#C6E06F;background:rgba(166,206,57,.08)">{{ q.l }}</button>
              </sc-for>
            </div>
          </div>
          <sc-if value="{{ hasParts }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ sameLast }}" style="display:block;width:100%;text-align:left;background:transparent;color:var(--fg-2);border:1px dashed var(--steel-600);border-radius:var(--r-sm);padding:8px 10px;font:700 10px/1.3 var(--font-head);text-transform:uppercase;letter-spacing:.08em;cursor:pointer" style-hover="border-color:#A6CE39;color:#C6E06F">Same as last part <span style="text-transform:none;font:500 9px/1.3 var(--font-mono);letter-spacing:.02em;color:var(--fg-3)">— ends + holes + heat copy over, just set length &amp; mark</span></button>
          </sc-if>
          <div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px"><span style="font:500 9px/1 var(--font-mono);color:var(--fg-3)">CUT LENGTH — {{ lenHint }}</span><span style="display:flex;gap:3px;flex:none"><button onClick="{{ lenModeWp }}" title="Type the work-point to work-point length" style="{{ lenWpS }}">WP-WP</button><button onClick="{{ lenModeOal }}" title="Type the overall long-point length off the tape — the app does the take-out math" style="{{ lenOalS }}">LONG PT</button></span></div>
            <input value="{{ lenT }}" onChange="{{ onLen }}" placeholder="12'-6 3/8" style="width:100%;box-sizing:border-box;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:600 16px/1.2 var(--font-mono);padding:10px 10px" style-focus="border-color:#A6CE39;outline:none">
            <div style="margin-top:5px;font:500 10.5px/1.5 var(--font-mono)"><span style="color:var(--fg-3)">READS </span><span style="{{ lenEchoStyle }}">{{ lenEcho }}</span><span style="color:var(--fg-3)"> · type 12'-6 3/8 · 150.375 · 6 1/2</span></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 110px;gap:6px">
            <div>
              <div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">MATERIAL / GRADE</div>
              <select data-sv="{{ mat }}" value="{{ mat }}" onChange="{{ onMat }}" style="width:100%;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 12.5px/1.2 var(--font-body);padding:8px 6px" style-focus="border-color:#A6CE39;outline:none"><sc-for list="{{ matOpts }}" as="mo" hint-placeholder-count="4"><option value="{{ mo.id }}">{{ mo.label }}</option></sc-for></select>
            </div>
            <div>
              <div style="font:500 8.5px/1 var(--font-mono);color:var(--fg-3);margin-bottom:3px">MARK #</div>
              <input value="{{ mark }}" onChange="{{ onMark }}" style="width:100%;box-sizing:border-box;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 13px/1.2 var(--font-mono);padding:8px 8px" style-focus="border-color:#A6CE39;outline:none">
            </div>
          </div>
          <div style="font:400 9.5px/1.5 var(--font-body);color:var(--fg-3)">MEMO — the mark # is the piece's name on tickets, DXF files and QR codes. It bumps itself (P-1 → P-2) each time you add a part to the job.</div>
          <button onClick="{{ goto2 }}" style="display:block;width:100%;background:var(--hivis);color:var(--on-accent);border:0;border-radius:var(--r-sm);padding:11px 14px;font:700 14px/1 var(--font-head);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;text-align:left;box-shadow:var(--inset-top)" style-hover="background:#8DB22A" style-active="transform:translateY(1px)">Next — End A <span style="float:right">›</span></button>
        </div>
      </sc-if>
      <sc-for list="{{ endSteps }}" as="ec" hint-placeholder-count="2">
        <button onClick="{{ ec.goto }}" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--border);padding:11px 4px;cursor:pointer" style-hover="background:rgba(166,206,57,.05)">
          <span style="{{ ec.nS }}">{{ ec.nT }}</span>
          <span style="flex:1;min-width:0"><span style="display:block;font:700 12px/1 var(--font-head);text-transform:uppercase;letter-spacing:.12em;color:var(--fg)">End {{ ec.id }} <span style="color:var(--fg-3);font:500 9px/1 var(--font-mono);letter-spacing:.04em;text-transform:none">{{ ec.side }}</span></span><span style="display:block;margin-top:3px;font:500 9.5px/1.3 var(--font-mono);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ ec.sum }}</span></span>
          <span style="flex:none;color:var(--fg-3);font:500 11px/1 var(--font-mono)">{{ ec.car }}</span>
        </button>
        <sc-if value="{{ ec.open }}" hint-placeholder-val="{{ false }}">
          <div style="padding:2px 4px 14px;display:flex;flex-direction:column;gap:10px">

          <div style="font:400 9.5px/1.5 var(--font-body);color:var(--fg-3);margin-bottom:6px">MEMO — + NEW JOB (top) files the finished job here for reprints &amp; DXFs later. Printed QR codes always reload their part on any machine.</div>
          <sc-if value="{{ hasArch }}" hint-placeholder-val="{{ false }}">
            <input value="{{ archQ }}" onChange="{{ onArchQ }}" placeholder="search job # · mark · size" style="width:100%;box-sizing:border-box;background:var(--gunmetal-800);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font:500 10px/1.2 var(--font-mono);padding:7px 7px" style-focus="border-color:#A6CE39;outline:none">
            <sc-for list="{{ archList }}" as="aj" hint-placeholder-count="1">
              <div style="border:1px solid var(--border);border-radius:var(--r-sm);background:var(--gunmetal-800);padding:7px 8px;margin-top:6px">
                <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
                  <span style="font:700 11px/1 var(--font-mono);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ aj.job }}</span>
                  <span style="flex:none;font:500 9px/1 var(--font-mono);color:var(--fg-3)">{{ aj.date }}</span>
                </div>
                <div style="margin-top:3px;font:500 9px/1.4 var(--font-mono);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ aj.sum }}</div>
                <div style="margin-top:5px;display:flex;gap:4px">
                  <button onClick="{{ aj.open }}" style="flex:1;padding:5px 6px;cursor:pointer;border-radius:4px;border:1px solid var(--steel-600);background:transparent;color:var(--fg-2);font:700 9px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase" style-hover="border-color:#A6CE39;color:#C6E06F">Open</button>
                  <button onClick="{{ aj.del }}" style="flex:none;padding:5px 8px;cursor:pointer;border-radius:4px;border:1px solid var(--steel-600);background:transparent;color:var(--fg-3);font:700 9px/1 var(--font-head)" style-hover="border-color:#D2402F;color:#D2402F">×</button>
                </div>
              </div>
            </sc-for>
          </sc-if>
          <div style="display:flex;gap:5px;margin-top:8px">
            <button onClick="{{ dlBackup }}" style="flex:1;padding:7px 8px;cursor:pointer;border-radius:4px;border:1px solid var(--steel-600);background:transparent;color:var(--fg-2);font:700 9.5px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase" style-hover="border-color:#A6CE39;color:#C6E06F">Backup — file</button>
            <button onClick="{{ doRestore }}" style="flex:1;padding:7px 8px;cursor:pointer;border-radius:4px;border:1px solid var(--steel-600);background:transparent;color:var(--fg-2);font:700 9.5px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase" style-hover="border-color:#A6CE39;color:#C6E06F">Restore</button>
          </div>
          <div style="margin-top:4px;font:500 9px/1.4 var(--font-mono);color:var(--hivis)">{{ archMsg }}</div>
        </div>
      </div>
      </sc-if>
  </div>
  <div style="flex:none;height:28px;background:var(--gunmetal-900);border-top:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 14px;font:500 9.5px/1 var(--font-mono);letter-spacing:.06em;color:var(--steel-400);white-space:nowrap;overflow:hidden">
    <span style="{{ stReadyS }}">{{ stReady }}</span>
    <span>UNITS INCH</span>
    <span>SNAP 1/16</span>
    <span style="color:var(--fg-2)">{{ stDims }}</span>
    <span style="color:var(--fg-2)">{{ stWt }}</span>
    <span style="flex:1"></span>
    <span style="min-width:0;overflow:hidden;text-overflow:ellipsis">SMOKE RANCH 12KW · STEAMPUNK FABRICATION · HAZLEHURST MS · (601) 757-3377</span>
  </div>
</div>
</script>
<script>
// Service worker — offline cache. Same update pattern as PipePro: after an
// update takes control, reload only while the tab is hidden so the app never
// gets yanked out from under whoever is using it.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function () {
    var reloaded = false, pending = false;
    function swReload() { if (reloaded) return; reloaded = true; location.reload(); }
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (document.visibilityState === 'hidden') swReload(); else pending = true;
    });
    document.addEventListener('visibilitychange', function () {
      if (pending && document.visibilityState === 'hidden') swReload();
    });
  }).catch(function () {});
}
</script>
